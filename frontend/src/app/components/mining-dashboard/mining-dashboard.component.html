<div class="container-xl dashboard-container"><div class="row row-cols-1 row-cols-md-2"><div class="col"><app-difficulty></app-difficulty></div><div class="col"><div class="card"><div class="card-body"><a class="title-link" routerLink="/graphs/mining/block-fees"><h5 class="card-title">Block Fees</h5></a><app-block-fees-graph [widget]="true" [left]="8" [right]="10"></app-block-fees-graph></div></div></div></div><div class="card"><div class="card-body"><h5 class="card-title">Block Rewards</h5><div class="table-responsive"><table class="table"><thead><tr><th>Height</th><th class="d-none d-md-table-cell">Pool</th><th title="Coinbase outputs">Coinbase</th><th>Fees</th></tr></thead><tbody><tr *ngFor="let b of stateService.blocks$ | async"><td><a [routerLink]="['/block',b.id]">{{b.height}}</a></td><td class="d-none d-md-table-cell">{{b.extras.pool.name}}</td><td><app-btc [satoshis]="b.extras.reward"></app-btc></td><td><app-btc *ngIf="b.extras.totalFees != null; else unavailable" [satoshis]="b.extras.totalFees"></app-btc><ng-template #unavailable>—</ng-template></td></tr></tbody></table></div></div></div></div>
