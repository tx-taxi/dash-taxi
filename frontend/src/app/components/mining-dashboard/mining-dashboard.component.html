<div class="container-xl dashboard-container"><div class="row row-cols-1 row-cols-md-2"><div class="col"><app-difficulty></app-difficulty></div><div class="col"><div class="main-title">Recent mining data</div><div class="card"><div class="card-body"><p>Latest 10 observed blocks. Coinbase outputs include miner and masternode payments.</p><p class="text-secondary">Historical hashrate and pool-dominance series are unavailable.</p></div></div></div></div><div class="card"><div class="card-body"><table class="table"><thead><tr><th>Height</th><th>Pool</th><th>Coinbase outputs</th><th>Transaction fees</th></tr></thead><tbody><tr *ngFor="let b of stateService.blocks$ | async"><td><a [routerLink]="['/block',b.id]">{{b.height}}</a></td><td>{{b.extras.pool.name}}</td><td><app-btc [satoshis]="b.extras.reward"></app-btc></td><td><app-btc *ngIf="b.extras.totalFees != null; else unavailable" [satoshis]="b.extras.totalFees"></app-btc><ng-template #unavailable>Unavailable</ng-template></td></tr></tbody></table></div></div></div>
