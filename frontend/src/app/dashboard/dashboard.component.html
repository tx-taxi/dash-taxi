<div class="container-xl dashboard-container"><div class="row row-cols-1 row-cols-md-2">
<div class="col card-wrapper"><div class="main-title">Block Fees</div><div class="card"><div class="card-body more-padding"><div class="difficulty-stats d-flex justify-content-around" *ngIf="blocks$ | async as blocks"><div class="text-center"><div class="card-text"><app-fee-rate [fee]="blocks[0]?.extras?.medianFee"></app-fee-rate></div><div class="symbol">Median rate</div></div><div class="text-center"><div class="card-text"><app-btc *ngIf="blocks[0]?.extras?.totalFees != null; else unknown" [satoshis]="blocks[0].extras.totalFees"></app-btc><ng-template #unknown>—</ng-template></div><div class="symbol">Total fees</div></div></div></div></div></div>
<div class="col"><app-difficulty></app-difficulty></div>
<div class="col"><div class="card graph-card"><div class="card-body ps-lg-3 pe-lg-3 ps-2 pe-2"><a class="title-link" routerLink="/txs"><h5 id="pending-transactions" class="card-title">Pending Transactions</h5></a><ng-container *ngIf="observedPending$ | async as pending; else pendingUnavailable"><div class="mempool-block-wrapper" *ngIf="webGlEnabled; else listFallback"><app-mempool-block-overview [observedTransactions]="pending" [resolution]="goggleResolution" gradientMode="age"></app-mempool-block-overview></div><ng-template #listFallback><p class="p-4"><a routerLink="/txs">View transactions</a></p></ng-template><small class="text-secondary" *ngIf="!pending.length">No recent transactions.</small></ng-container><ng-template #pendingUnavailable><p class="p-4 text-secondary">Unavailable. Retrying…</p></ng-template></div></div></div>
<div class="col"><div class="card graph-card"><div class="card-body"><h5 class="card-title">Incoming Transactions</h5><small class="d-block text-secondary" *ngIf="(observedPending$ | async) === null">Reconnecting…</small><div class="mempool-graph" *ngIf="mempoolStats$ | async as stats"><app-incoming-transactions-graph [height]="incomingGraphHeight" [left]="50" [right]="20" [data]="stats.weightPerSecond" windowPreferenceOverride="2h"></app-incoming-transactions-graph></div></div></div></div>
<div class="col"><ng-container *ngTemplateOutlet="latestBlocks"></ng-container></div><div class="col"><div class="card"><div class="card-body"><a class="title-link" routerLink="/txs"><h5 class="card-title">Recent Transactions</h5></a><app-recent-transactions-list [widget]="true"></app-recent-transactions-list></div></div></div>
</div></div><ng-template #latestBlocks>
        <div class="card">
          <div class="card-body">
            <a class="title-link" href="" [routerLink]="['/blocks' | relativeUrl]">
              <h5 class="card-title d-inline" i18n="dashboard.recent-blocks">Recent Blocks</h5>
              <span>&nbsp;</span>
              <fa-icon [icon]="['fas', 'external-link-alt']" [fixedWidth]="true" style="vertical-align: text-top; font-size: 13px; color: var(--title-fg)"></fa-icon>
            </a>
            <table class="table lastest-blocks-table">
              <thead>
                <th class="table-cell-height" i18n="dashboard.latest-blocks.height">Height</th>
                <th class="table-cell-mined" i18n="dashboard.latest-blocks.mined">Mined</th>
                <th class="table-cell-transaction-count" i18n="dashboard.latest-blocks.transaction-count">TXs</th>
                <th class="table-cell-size" i18n="dashboard.latest-blocks.size">Size</th>
              </thead>
              <tbody *ngIf="blocks$ | async as blocks; else blocksSkeleton">
                <tr *ngFor="let block of blocks; let i = index; trackBy: trackByBlock">
                  <td class="table-cell-height" ><a [routerLink]="['/block' | relativeUrl, block.id]" [state]="{ data: { block: block } }">{{ block.height }}</a></td>
                  <td class="table-cell-mined" ><app-time kind="since" [time]="block.timestamp" [fastRender]="true" [showTooltip]="true"></app-time></td>
                  <td class="table-cell-transaction-count">{{ block.tx_count | number }}</td>
                  <td class="table-cell-size">
                    <div class="progress">
                      <div class="progress-bar progress-mempool {{ network$ | async }}" role="progressbar" [ngStyle]="{'width': (block.weight / stateService.env.BLOCK_WEIGHT_UNITS)*100 + '%' }">&nbsp;</div>
                      <div class="progress-text" [innerHTML]="block.size | bytes: 2"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </ng-template><ng-template #blocksSkeleton><tbody><tr><td class="text-secondary">Loading blocks…</td></tr></tbody></ng-template>
