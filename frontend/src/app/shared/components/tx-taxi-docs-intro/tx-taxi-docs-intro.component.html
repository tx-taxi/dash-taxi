<section class="taxi-docs-intro" aria-label="About tx.taxi" i18n-aria-label="@@tx-taxi.intro-aria">
  <div class="taxi-docs-art" aria-hidden="true"></div>
  <div class="taxi-docs-copy">
    <p class="taxi-docs-eyebrow">tx.taxi <span aria-hidden="true">/</span> {{ chainName }} {{ localizedContext }}</p>
    <h2 i18n="@@tx-taxi.intro-heading">One search across chains.</h2>
    <p i18n="@@tx-taxi.intro-description">Paste a transaction, block or address into tx.taxi. Open a confirmed match, choose between possible networks, or head straight to your chain’s explorer.</p>
    <div class="taxi-docs-actions">
      <a class="taxi-docs-button" href="https://tx.taxi/"><span i18n="@@tx-taxi.intro-open">Open tx.taxi </span><span aria-hidden="true">↗︎</span></a>
      <a class="taxi-docs-native" href="./" [attr.aria-label]="openChainLabel"><span i18n="@@tx-taxi.intro-explore">Explore {{ chainName }}</span> <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
